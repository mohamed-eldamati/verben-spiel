<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Was machst du gern? – Verben-Spiel</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9f5f3; --paper:#ffffff; --ink:#173653; --soft:#5d7891;
  --teal:#1a9aa8; --coral:#ff5a5f; --sun:#ffc83d; --green:#2fb26b; --red:#e5484d;
  --line:#cfe3e0; --shadow:0 6px 0 rgba(23,54,83,.10), 0 14px 26px rgba(23,54,83,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS","Segoe UI",sans-serif;font-size:19px;line-height:1.45;
  background-image:radial-gradient(circle at 12% 8%,#d3ece8 0,transparent 32%),radial-gradient(circle at 92% 20%,#fff1c9 0,transparent 26%)}
h1,h2,h3,.disp{font-family:"Baloo 2","Trebuchet MS","Segoe UI",sans-serif;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,.card:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}

header{text-align:center;padding:14px 0 8px}
header h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;color:var(--ink)}
header p{margin:8px 0 0;color:var(--soft);font-size:1.1rem}

nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0 10px}
nav button{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 20px;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.15rem;box-shadow:0 4px 0 var(--ink);transition:transform .08s}
nav button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
nav button[aria-selected="true"]{background:var(--coral);color:#fff}

.bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin:14px 0 22px}
.pill{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 18px;font-weight:800}
.pill b{font-family:"Baloo 2",sans-serif;font-size:1.3rem;margin-left:6px}
.btn{background:var(--teal);color:#fff;border-radius:14px;padding:10px 22px;font-weight:800;box-shadow:0 4px 0 #0f6b76}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0f6b76}
.btn.alt{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #c99a12}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.hint{text-align:center;color:var(--soft);font-weight:700;margin:0 0 16px}

section[hidden]{display:none}

/* Bildkarten */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px}
.card{background:var(--paper);border-radius:10px;padding:10px 10px 12px;box-shadow:var(--shadow);border:3px solid transparent;position:relative;transition:transform .15s}
.card:nth-child(odd){transform:rotate(-1.4deg)}
.card:nth-child(even){transform:rotate(1.2deg)}
.card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:4px;background:#dde}
.card .label{margin-top:10px;min-height:2.6rem;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.3rem}

/* Lernen */
.learn .card{cursor:pointer}
.learn .card:hover{transform:rotate(0) scale(1.03)}
.learn .label{gap:8px}
.spk{font-size:1.2rem}

/* Zuordnen */
.match .card{cursor:pointer}
.match .card.sel{border-color:var(--sun);transform:scale(1.04) rotate(0)}
.match .slot{margin-top:10px;min-height:3rem;border:3px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.25rem;color:var(--soft);text-align:center;padding:2px 6px}
.match .card.over .slot{border-color:var(--teal);background:#e2f6f7}
.match .card.done{border-color:var(--green)}
.match .card.done .slot{border:3px solid var(--green);background:#e6f8ee;color:#12703f}
.match .card.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.bank{margin-top:30px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:18px;box-shadow:0 6px 0 var(--ink)}
.bank h3{font-size:1.4rem;margin-bottom:12px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:56px}
.chip{background:var(--sun);color:var(--ink);border-radius:14px;padding:10px 20px;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.3rem;box-shadow:0 4px 0 #c99a12;user-select:none;touch-action:manipulation}
.chip.sel{background:var(--coral);color:#fff;box-shadow:0 4px 0 #b3363a;transform:translateY(-3px)}
.chip[draggable=true]{cursor:grab}
.chip.dragging{opacity:.45}

/* Quiz */
.stage{max-width:560px;margin:0 auto;text-align:center}
.stage .card{transform:rotate(-1deg);margin:0 auto 22px;max-width:380px}
.stage .card .label{font-size:1.4rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:14px 10px;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.4rem;box-shadow:0 4px 0 var(--ink)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.ok{background:var(--green);color:#fff;border-color:#12703f;box-shadow:0 4px 0 #12703f}
.opt.no{background:var(--red);color:#fff;border-color:#8e1f23;box-shadow:0 4px 0 #8e1f23}
.opt:disabled{cursor:default}
.progress{height:14px;background:var(--paper);border:2px solid var(--line);border-radius:999px;overflow:hidden;margin:0 auto 20px;max-width:560px}
.progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
.msg{min-height:2.2rem;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.4rem;margin:16px 0 4px}
.msg.ok{color:var(--green)}.msg.no{color:var(--red)}

/* Buchstaben */
.slots,.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.ltr{width:46px;height:52px;border-radius:10px;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.6rem;display:flex;align-items:center;justify-content:center}
.ltr.slot{background:var(--paper);border:3px dashed var(--line);cursor:pointer}
.ltr.slot.filled{border:3px solid var(--ink);border-style:solid}
.ltr.gap{width:20px;border:0;background:none}
.ltr.tile{background:var(--sun);box-shadow:0 4px 0 #c99a12}
.ltr.tile:disabled{opacity:.25;box-shadow:none}
.slots.good .ltr.slot{background:#e6f8ee;border-color:var(--green);color:#12703f}
.slots.bad{animation:shake .4s}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}

/* Ende */
.end{max-width:520px;margin:20px auto;background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:26px;text-align:center;box-shadow:0 8px 0 var(--ink)}
.end h2{font-size:2.3rem;margin-bottom:6px}
.stars{font-size:2.6rem;letter-spacing:6px;margin:6px 0 14px}
.confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:50;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Was machst du gern?</h1>
    <p>Lerne 10 Verben mit Bildern – und spiele dann!</p>
  </header>

  <nav role="tablist" aria-label="Spiele">
    <button role="tab" aria-selected="true" data-tab="learn">Lernen</button>
    <button role="tab" aria-selected="false" data-tab="match">Zuordnen</button>
    <button role="tab" aria-selected="false" data-tab="quiz">Quiz</button>
    <button role="tab" aria-selected="false" data-tab="scramble">Buchstaben-Puzzle</button>
  </nav>

  <div class="bar">
    <button class="btn ghost" id="soundBtn" aria-pressed="true">Ton: an</button>
  </div>

  <!-- LERNEN -->
  <section id="learn" class="learn">
    <p class="hint">Klicke auf ein Bild und höre das Wort.</p>
    <div class="grid" id="learnGrid"></div>
  </section>

  <!-- ZUORDNEN -->
  <section id="match" class="match" hidden>
    <div class="bar">
      <span class="pill">Richtig<b id="mOk">0</b></span>
      <span class="pill">Fehler<b id="mErr">0</b></span>
      <button class="btn alt" id="mReset">Neu mischen</button>
    </div>
    <p class="hint">Wähle ein Wort und dann das passende Bild. Du kannst das Wort auch auf das Bild ziehen.</p>
    <div class="grid" id="mGrid"></div>
    <div class="bank"><h3>Wörter</h3><div class="chips" id="mChips"></div></div>
    <div id="mEnd"></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" hidden>
    <div class="bar">
      <span class="pill">Frage<b id="qNum">1</b>/10</span>
      <span class="pill">Punkte<b id="qScore">0</b></span>
    </div>
    <div class="progress"><i id="qBar"></i></div>
    <div class="stage" id="qStage"></div>
  </section>

  <!-- BUCHSTABEN -->
  <section id="scramble" hidden>
    <div class="bar">
      <span class="pill">Bild<b id="sNum">1</b>/10</span>
      <span class="pill">Punkte<b id="sScore">0</b></span>
    </div>
    <div class="progress"><i id="sBar"></i></div>
    <div class="stage" id="sStage"></div>
  </section>
</div>

const WORDS = ["fotografieren","singen","kochen","schwimmen","reisen","tanzen","joggen","Musik hören","ins Kino gehen","lesen"];
const ITEMS = WORDS.map((w,i)=>({w, img:IMGS[i]}));

const $ = (s,r=document)=>r.querySelector(s);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------- Ton ---------- */
let sound = true, voice = null;
function pickVoice(){
  const v = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  voice = v.find(x=>x.lang && x.lang.toLowerCase().startsWith('de')) || null;
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(t){
  if(!sound || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'de-DE'; if(voice) u.voice = voice; u.rate = .85;
  speechSynthesis.speak(u);
}
$('#soundBtn').onclick = e => {
  sound = !sound;
  e.target.textContent = 'Ton: ' + (sound?'an':'aus');
  e.target.setAttribute('aria-pressed', sound);
  if(!sound && window.speechSynthesis) speechSynthesis.cancel();
};

/* ---------- Konfetti ---------- */
function confetti(){
  const cols=['#ff5a5f','#ffc83d','#1a9aa8','#2fb26b','#173653'];
  for(let i=0;i<50;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%cols.length];
    c.style.animationDelay=Math.random()*.6+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),3400);
  }
}
function endBox(title, text, stars, again){
  const d=document.createElement('div'); d.className='end';
  d.innerHTML = `<h2 class="disp">${title}</h2><div class="stars" aria-hidden="true">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>${text}</p>`;
  const b=document.createElement('button'); b.className='btn'; b.textContent='Nochmal spielen'; b.onclick=again;
  d.appendChild(b); return d;
}
function starsFor(mistakes){ return mistakes===0?3:mistakes<=3?2:1; }

/* ---------- Tabs ---------- */
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected', x===b));
    document.querySelectorAll('main section, .wrap > section').forEach(s=>s.hidden = s.id!==b.dataset.tab);
    if(window.speechSynthesis) speechSynthesis.cancel();
    if(b.dataset.tab==='match') startMatch();
    if(b.dataset.tab==='quiz') startQuiz();
    if(b.dataset.tab==='scramble') startScramble();
  };
});

/* ---------- Lernen ---------- */
(function(){
  const g=$('#learnGrid');
  ITEMS.forEach((it,i)=>{
    const c=document.createElement('div'); c.className='card'; c.tabIndex=0; c.setAttribute('role','button');
    c.setAttribute('aria-label', it.w+' anhören');
    c.innerHTML=`<img src="${it.img}" alt="Bild ${i+1}"><div class="label"><span>${it.w}</span><span class="spk" aria-hidden="true">🔊</span></div>`;
    const go=()=>say(it.w);
    c.onclick=go; c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};
    g.appendChild(c);
  });
})();

/* ---------- Zuordnen ---------- */
let mSelChip=null, mSelCard=null, mOk=0, mErr=0;
function startMatch(){
  mSelChip=mSelCard=null; mOk=0; mErr=0;
  $('#mOk').textContent=0; $('#mErr').textContent=0; $('#mEnd').innerHTML='';
  const g=$('#mGrid'); g.innerHTML='';
  shuffle(ITEMS).forEach((it,i)=>{
    const c=document.createElement('div'); c.className='card'; c.dataset.w=it.w; c.tabIndex=0; c.setAttribute('role','button');
    c.setAttribute('aria-label','Bild, Wort noch offen');
    c.innerHTML=`<img src="${it.img}" alt="Bild"><div class="slot">?</div>`;
    c.onclick=()=>{ if(c.classList.contains('done')) return; mSelCard=c; refreshSel(); tryMatch(); };
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();c.click();}};
    c.ondragover=e=>{ if(!c.classList.contains('done')){e.preventDefault(); c.classList.add('over');} };
    c.ondragleave=()=>c.classList.remove('over');
    c.ondrop=e=>{ e.preventDefault(); c.classList.remove('over'); const w=e.dataTransfer.getData('text/plain');
      const chip=[...document.querySelectorAll('#mChips .chip')].find(x=>x.dataset.w===w);
      if(chip && !c.classList.contains('done')){ mSelChip=chip; mSelCard=c; tryMatch(); } };
    g.appendChild(c);
  });
  const ch=$('#mChips'); ch.innerHTML='';
  shuffle(ITEMS).forEach(it=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=it.w; b.dataset.w=it.w; b.draggable=true;
    b.onclick=()=>{ mSelChip=b; refreshSel(); say(it.w); tryMatch(); };
    b.ondragstart=e=>{ e.dataTransfer.setData('text/plain', it.w); b.classList.add('dragging'); };
    b.ondragend=()=>b.classList.remove('dragging');
    ch.appendChild(b);
  });
}
function refreshSel(){
  document.querySelectorAll('#mChips .chip').forEach(x=>x.classList.toggle('sel', x===mSelChip));
  document.querySelectorAll('#mGrid .card').forEach(x=>x.classList.toggle('sel', x===mSelCard));
}
function tryMatch(){
  if(!mSelChip || !mSelCard) return;
  const chip=mSelChip, card=mSelCard;
  if(chip.dataset.w===card.dataset.w){
    card.classList.add('done'); card.querySelector('.slot').textContent=card.dataset.w;
    card.setAttribute('aria-label','Richtig: '+card.dataset.w);
    chip.remove(); mOk++; $('#mOk').textContent=mOk; say(card.dataset.w);
    if(mOk===ITEMS.length){
      confetti();
      $('#mEnd').appendChild(endBox('Super gemacht!', mErr===0?'Alles richtig – ohne Fehler!':'Fehler: '+mErr, starsFor(mErr), startMatch));
      $('#mEnd').scrollIntoView({behavior:'smooth',block:'center'});
    }
  } else {
    mErr++; $('#mErr').textContent=mErr;
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    setTimeout(()=>card.classList.remove('shake'),450);
  }
  mSelChip=mSelCard=null; refreshSel();
}
$('#mReset').onclick=startMatch;

/* ---------- Quiz ---------- */
let qOrder, qI, qScore, qMist;
function startQuiz(){ qOrder=shuffle(ITEMS); qI=0; qScore=0; qMist=0; $('#qScore').textContent=0; showQ(); }
function showQ(){
  const st=$('#qStage'); st.innerHTML='';
  if(qI>=qOrder.length){
    $('#qBar').style.width='100%';
    confetti();
    st.appendChild(endBox('Geschafft!', `Punkte: ${qScore} von ${qOrder.length}`, qScore>=9?3:qScore>=6?2:1, startQuiz));
    return;
  }
  $('#qNum').textContent=qI+1; $('#qBar').style.width=(qI/qOrder.length*100)+'%';
  const it=qOrder[qI];
  const wrong=shuffle(ITEMS.filter(x=>x.w!==it.w)).slice(0,3);
  const opts=shuffle([it,...wrong]);
  st.innerHTML=`<div class="card"><img src="${it.img}" alt="Bild"><div class="label">Was passt zum Bild?</div></div><div class="opts"></div><div class="msg" id="qMsg" aria-live="polite"></div><div class="row"></div>`;
  const box=$('.opts',st);
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=o.w;
    b.onclick=()=>{
      box.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      if(o.w===it.w){ b.classList.add('ok'); qScore++; $('#qScore').textContent=qScore; const m=$('#qMsg'); m.textContent='Richtig!'; m.className='msg ok'; say(it.w); }
      else { b.classList.add('no'); box.querySelectorAll('.opt').forEach(x=>{ if(x.textContent===it.w) x.classList.add('ok'); });
        const m=$('#qMsg'); m.textContent='Nicht ganz: '+it.w; m.className='msg no'; say(it.w); }
      const n=document.createElement('button'); n.className='btn'; n.textContent = qI+1<qOrder.length?'Weiter':'Ergebnis';
      n.onclick=()=>{ qI++; showQ(); }; $('.row',st).appendChild(n); n.focus();
    };
    box.appendChild(b);
  });
}

/* ---------- Buchstaben-Puzzle ---------- */
let sOrder, sI, sScore, sHints;
function startScramble(){ sOrder=shuffle(ITEMS); sI=0; sScore=0; $('#sScore').textContent=0; showS(); }
function showS(){
  const st=$('#sStage'); st.innerHTML='';
  if(sI>=sOrder.length){
    $('#sBar').style.width='100%'; confetti();
    st.appendChild(endBox('Geschafft!', `Gelöst: ${sScore} von ${sOrder.length}`, sScore>=9?3:sScore>=6?2:1, startScramble));
    return;
  }
  $('#sNum').textContent=sI+1; $('#sBar').style.width=(sI/sOrder.length*100)+'%';
  const it=sOrder[sI];
  const chars=[...it.w];
  const letters=chars.filter(c=>c!==' ');
  let tiles=shuffle(letters.map((c,i)=>({c,i,used:false})));
  if(tiles.map(t=>t.c).join('')===letters.join('') && letters.length>1) tiles=tiles.reverse();
  const filled=[]; // Liste von Tile-Objekten in Reihenfolge
  let wrongTries=0;
  st.innerHTML=`<div class="card"><img src="${it.img}" alt="Bild"><div class="label">Bringe die Buchstaben in Ordnung</div></div><div class="slots" id="sSlots" aria-live="polite"></div><div class="tiles" id="sTiles"></div><div class="msg" id="sMsg" aria-live="polite"></div><div class="row" id="sRow"></div>`;
  const slotsEl=$('#sSlots',st), tilesEl=$('#sTiles',st), msg=$('#sMsg',st), row=$('#sRow',st);
  const hint=document.createElement('button'); hint.className='btn alt'; hint.textContent='Tipp'; row.appendChild(hint);
  const clear=document.createElement('button'); clear.className='btn ghost'; clear.textContent='Löschen'; row.appendChild(clear);
  let locked=false;
  function draw(){
    slotsEl.innerHTML='';
    let k=0;
    chars.forEach(ch=>{
      const d=document.createElement('div');
      if(ch===' '){ d.className='ltr gap'; slotsEl.appendChild(d); return; }
      const t=filled[k]; const idx=k; k++;
      d.className='ltr slot'+(t?' filled':'');
      d.textContent=t?t.c:'';
      if(t){ d.tabIndex=0; d.onclick=()=>{ if(locked) return; filled.splice(idx,1).forEach(x=>x.used=false); draw(); }; }
      slotsEl.appendChild(d);
    });
    tilesEl.innerHTML='';
    tiles.forEach(t=>{
      const b=document.createElement('button'); b.className='ltr tile'; b.textContent=t.c; b.disabled=t.used;
      b.onclick=()=>{ if(locked||t.used) return; t.used=true; filled.push(t); draw(); if(filled.length===letters.length) check(); };
      tilesEl.appendChild(b);
    });
  }
  function check(){
    const ans=filled.map(t=>t.c).join('');
    if(ans===letters.join('')){
      locked=true; slotsEl.classList.add('good'); msg.textContent='Richtig! '+it.w; msg.className='msg ok'; say(it.w);
      if(wrongTries===0 && !sHints) sScore++;
      $('#sScore').textContent=sScore;
      const n=document.createElement('button'); n.className='btn'; n.textContent=sI+1<sOrder.length?'Weiter':'Ergebnis';
      n.onclick=()=>{ sI++; sHints=false; showS(); }; row.innerHTML=''; row.appendChild(n); n.focus();
    } else {
      wrongTries++; msg.textContent='Noch nicht richtig. Versuch es nochmal!'; msg.className='msg no';
      slotsEl.classList.remove('bad'); void slotsEl.offsetWidth; slotsEl.classList.add('bad');
      setTimeout(()=>{ filled.splice(0).forEach(x=>x.used=false); slotsEl.classList.remove('bad'); draw(); },600);
    }
  }
  hint.onclick=()=>{
    if(locked) return; sHints=true;
    filled.splice(0).forEach(x=>x.used=false);
    const first=tiles.find(t=>t.c===letters[0]);
    first.used=true; filled.push(first); msg.textContent='Der erste Buchstabe: '+letters[0]; msg.className='msg'; draw();
  };
  clear.onclick=()=>{ if(locked) return; filled.splice(0).forEach(x=>x.used=false); msg.textContent=''; draw(); };
  sHints=false; draw();
}
</script>
